<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Gastos</title>
<meta name="theme-color" content="#7BC795">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Gastos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{
  --green:#7BC795; --green-d:#5BB07A; --green-l:#E3F5E8; --bg:#F1FBF3;
  --red:#E9605A; --red-l:#FDECEB; --orange:#F0A030;
  --text:#333; --muted:#8B958E; --line:#E2EDE5; --card:#fff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --tabh:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:inherit}
.ic{width:24px;height:24px;flex:none;display:block}
.hidden{display:none!important}

/* ---------- layout */
#app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding-top:var(--safe-t);box-shadow:0 1px 0 rgba(0,0,0,.05)}
.top-row{display:flex;align-items:center;height:54px;padding:0 8px;gap:4px;max-width:760px;margin:0 auto}
.top-row .title{flex:1;text-align:center;font-size:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.top-btn:active{background:rgba(255,255,255,.2)}
.top-btn .ic{width:24px;height:24px}
.period{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px 10px;max-width:760px;margin:0 auto}
.period button.lbl{min-width:190px;padding:6px 14px;border-radius:18px;background:rgba(255,255,255,.18);font-size:16px;font-weight:500}
.period .top-btn{width:36px;height:36px}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:14px 14px calc(var(--tabh) + var(--safe-b) + 90px)}
.sync-dot{position:relative}
.sync-dot[data-s="busy"] .ic{animation:spin 1s linear infinite}
.sync-dot[data-s="err"]::after{content:"";position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:#FFD54A;border:1.5px solid var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);display:flex;justify-content:center}
.tabs-in{display:flex;width:100%;max-width:760px}
.tab{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9AA59D;font-size:11px;font-weight:500}
.tab.on{color:var(--green-d)}
.tab .ic{width:25px;height:25px}

/* ---------- cards & lists */
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(40,80,50,.08);margin-bottom:14px;overflow:hidden}
.card.pad{padding:14px 16px}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:20px 4px 8px;display:flex;align-items:center;justify-content:space-between}
.sec-title .lnk{text-transform:none;letter-spacing:0;color:var(--green-d);font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:56px}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}.row.tap:active{background:#F6FBF7}
.row .grow{flex:1;min-width:0}
.row .name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;white-space:nowrap;text-align:right}
.row .amt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.cat-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.cat-ic .ic{width:22px;height:22px}
.muted{color:var(--muted)} .red{color:var(--red)} .green{color:var(--green-d)}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:15px}
.chev{color:#C2CCC5}

/* summary */
.summary{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.summary>div{padding:14px 6px}
.summary .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.summary .v{font-size:17px;font-weight:600;margin-top:4px;white-space:nowrap}
.summary .v.big{font-size:20px}
.bar{height:8px;border-radius:5px;background:#EAF1EC;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:5px}
.bar.warn>i{background:var(--orange)} .bar.over>i{background:var(--red)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;background:var(--green);color:#fff;font-weight:600;font-size:16px}
.btn:active{filter:brightness(.95)}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--green-d);box-shadow:inset 0 0 0 1.5px var(--green)}
.btn.danger{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn .ic{width:20px;height:20px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1}
.seg{display:flex;background:#E4F1E7;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:500;color:#5D6B61;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---------- gastos: donut */
.donut-wrap{position:relative;width:100%;max-width:380px;margin:0 auto}
.donut-wrap svg{width:100%;height:auto;display:block}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center .t{font-size:13px;color:var(--muted)}
.donut-center .v.sm{font-size:17px}.donut-center .v{font-size:22px;font-weight:700;color:var(--red);margin-top:2px}
.donut-center .inc{font-size:16px;font-weight:600;color:var(--green-d);margin-top:6px}.donut-center .inc.sm{font-size:13.5px}
.donut-center .c{font-size:12px;color:var(--muted);margin-top:2px}
.ring-btn{cursor:pointer}
.ring-btn:active circle{fill:#F0F7F2}
.fab-minus{display:flex;align-items:center;justify-content:center;width:68px;height:68px;border-radius:50%;background:var(--red);color:#fff;
  box-shadow:0 4px 12px rgba(233,96,90,.4);margin:6px auto 4px}
.fab-minus .ic{width:36px;height:36px;stroke-width:2.6}
.fab-minus:active{transform:scale(.96)}
.fab-float{position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(var(--tabh) + var(--safe-b) + 16px);z-index:25;width:58px;height:58px;margin:0}
.pct{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.exp-sub{background:#FAFDFB}
.exp-sub .row{padding-left:66px;min-height:48px}
.day-h{display:flex;justify-content:space-between;padding:10px 14px 6px;font-size:13px;color:var(--muted);font-weight:600;background:#F7FBF8;border-bottom:1px solid var(--line)}

/* ---------- modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,40,25,.35);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + var(--safe-b));animation:up .2s ease-out}
@media(min-width:700px){.modal-bg{align-items:center}.sheet{border-radius:18px;padding-bottom:18px}}
.sheet h3{margin:0 0 14px;font-size:19px;text-align:center}
.sheet p{margin:0 0 14px;line-height:1.4;color:#555}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:.5}}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.inp{width:100%;height:46px;border:1.5px solid var(--line);border-radius:11px;padding:0 12px;background:#fff;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--green)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,#999 50%),linear-gradient(135deg,#999 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:14px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--green-d)}

/* full-screen add expense */
.full{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;animation:up .18s ease-out}
.full .top{position:relative}
.full .top-row .txt-btn{padding:0 10px;height:44px;font-size:17px}
.full-body{flex:1;overflow:auto;width:100%;max-width:560px;margin:0 auto;padding:12px 14px calc(14px + var(--safe-b));display:flex;flex-direction:column}
.date-row{display:flex;align-items:center;justify-content:center;gap:8px;color:#555;font-size:18px;padding:10px 0 16px;position:relative}
.date-row .ic{color:#888}
.date-row input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.amount-bar{display:flex;align-items:center;background:var(--green);border-radius:6px;border:2px solid var(--green-d);color:#fff;min-height:76px;padding:8px 10px}
.amount-bar .cur{display:flex;flex-direction:column;align-items:center;padding-right:10px;margin-right:10px;border-right:2px solid rgba(255,255,255,.7);color:#3f7a52;font-size:15px}
.amount-bar .cur .ic{width:32px;height:32px;color:#fff;stroke-width:1.5}
.amount-bar .expr{flex:1;min-width:0;text-align:right;font-weight:300;line-height:1.1}
.amount-bar .expr .res{font-size:17px;opacity:.85;min-height:19px}
.amount-bar .expr .main{font-size:44px;white-space:nowrap;overflow:hidden}
.amount-bar .expr .main.m{font-size:32px}.amount-bar .expr .main.s{font-size:22px;white-space:normal;word-break:break-all}
.amount-bar .bk{width:52px;height:52px;display:flex;align-items:center;justify-content:center;margin-left:4px}
.amount-bar .bk .ic{width:30px;height:30px}
.note-inp{margin:12px 0;border:0;border-bottom:1.5px solid var(--line);background:transparent;height:44px;padding:0 4px;outline:none;width:100%}
.note-inp:focus{border-color:var(--green)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto;padding-top:6px}
.keypad button{height:58px;border-radius:12px;background:#fff;font-size:24px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.keypad button.op{background:#E4F3E8;color:var(--green-d);font-size:24px}
.keypad button:active{background:#DDEFE2}
.choose{margin-top:12px;height:56px;border-radius:12px;background:var(--green-d);color:#fff;font-size:17px;font-weight:600;letter-spacing:.03em;width:100%}
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px;margin-top:22px}
.cat-tile{min-width:0;background:#fff;border-radius:3px;padding:12px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:-2px 2px 0 #9ED3AE, 0 1px 2px rgba(0,0,0,.06);min-height:96px;position:relative}
.cat-tile .ic{width:40px;height:40px;stroke-width:1.4}
.cat-tile span{font-size:13.5px;max-width:100%;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-tile.sel{outline:2.5px solid var(--green-d)}
.cat-tile:active{transform:scale(.97)}
.add-tile{display:flex;align-items:center;justify-content:center}
.add-tile b{width:58px;height:58px;border-radius:50%;background:#B9E2C5;border:4px solid #8FD0A3;display:flex;align-items:center;justify-content:center;color:#fff}
.add-tile b .ic{width:34px;height:34px;stroke-width:3}
@media(min-width:560px){.cat-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

/* icon/color pickers */
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:210px;overflow:auto;padding:2px}
.icon-grid button{height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#F4F8F5}
.icon-grid button.on{background:var(--green-l);outline:2px solid var(--green)}
.color-grid{display:flex;flex-wrap:wrap;gap:8px}
.color-grid button{width:34px;height:34px;border-radius:50%}
.color-grid button.on{outline:3px solid #333;outline-offset:2px}

/* pagos */
.pay-chk{width:30px;height:30px;border-radius:8px;border:2px solid #C5D3C9;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.pay-chk.on{background:var(--green-d);border-color:var(--green-d)}
.pay-chk .ic{width:20px;height:20px;stroke-width:3}
.amt-btn{font-weight:600;padding:6px 8px;border-radius:8px;white-space:nowrap;text-align:right}
.amt-btn:active{background:#EEF6F0}
.amt-btn.est{color:#9AA59D;font-style:italic;font-weight:500}
.paid-row .name{color:#7F8A82}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:9px;background:#EEF5F0;color:#5F6E64;margin-right:4px;vertical-align:1px}
.tag.red{background:var(--red-l);color:var(--red)}
.tag.ok{background:var(--green-l);color:var(--green-d)}
.date-lnk{color:var(--green-d);text-decoration:underline;text-decoration-style:dotted;cursor:pointer}

/* presupuesto */
.bud-row{padding:12px 14px;border-bottom:1px solid var(--line)}
.bud-row:last-child{border-bottom:0}
.bud-top{display:flex;align-items:center;gap:10px}
.bud-top .name{flex:1;font-size:16px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud-inp{width:132px;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;text-align:right;outline:none;background:#fff;font-variant-numeric:tabular-nums}
.bud-inp:focus{border-color:var(--green)}
.bud-meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin:8px 0 5px 50px;gap:8px}
.bud-row .bar{margin-left:50px}
.sug{color:var(--green-d);background:var(--green-l);border-radius:8px;padding:3px 8px;font-size:12.5px;white-space:nowrap}
.traer{background:linear-gradient(135deg,#6DBE88,#4FA56F);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px}
.traer .k{font-size:13px;opacity:.9;text-transform:uppercase;letter-spacing:.04em}
.traer .v{font-size:30px;font-weight:700;margin:4px 0 10px}
.traer .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.traer .grid b{display:block;font-size:16px}
.inc-row{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.inc-row:last-child{border-bottom:0}
.inc-row .inp{height:40px}
.inc-row .inp.nm{flex:1}
.inc-row .inp.num{width:140px}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:#A7B1AA;flex:none}
.icon-btn:active{background:#F0F5F1}
.chart6{display:flex;align-items:flex-end;gap:10px;height:150px;padding:16px 14px 0}
.chart6 .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.chart6 .b{width:70%;max-width:44px;background:var(--green);border-radius:6px 6px 0 0;min-height:2px}
.chart6 .b.over{background:var(--red)}
.chart6 .mk{position:absolute;left:8%;right:8%;border-top:2px dashed #555;opacity:.5}
.chart6-l{display:flex;gap:10px;padding:6px 14px 14px}
.chart6-l div{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.chart6-l b{display:block;color:var(--text);font-size:11.5px;font-weight:600}

/* ahorros */
.sv-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sv-table th{background:#1F2A22;color:#fff;font-size:13px;font-weight:600;padding:10px 8px;text-align:right}
.sv-table th:first-child{text-align:left}
.sv-table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:14.5px;white-space:nowrap}
.sv-table td:first-child{text-align:left}
.sv-table tr.tap{cursor:pointer}
.sv-table tr.tap:active td{background:#F3FAF5}
.sv-table tr.future td{color:#B5BDB8}
.sv-table tfoot td{font-weight:700;border-bottom:0}
.sv-table td.in{background:#E7F5EA} .sv-table td.out{background:#FDECEB}
.neg{color:var(--red)}
.tot-in{background:#9BD48B!important} .tot-out{background:#F04A3E!important;color:#fff}
.sv-title{background:#000;color:#fff;text-align:center;font-weight:700;font-size:18px;padding:12px;letter-spacing:.02em}

/* inversion */
.inv-row{display:grid;grid-template-columns:1fr 70px 110px;gap:8px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.inv-row:active{background:#F6FBF7}
.inv-row:last-child{border-bottom:0}
.inv-row .r{text-align:right;font-variant-numeric:tabular-nums}
.inv-head{font-size:12px;color:var(--muted);text-transform:uppercase;cursor:default;background:#F7FBF8}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 92px);transform:translateX(-50%);background:#2E3A31;color:#fff;padding:11px 18px;border-radius:22px;font-size:15px;z-index:200;
  box-shadow:0 4px 14px rgba(0,0,0,.2);animation:fade .2s;max-width:90vw;text-align:center}
.toast .undo{color:#9FE3B3;font-weight:600;margin-left:12px}

.prose{line-height:1.5;font-size:15px;color:#444}
.prose ol{padding-left:20px}.prose li{margin-bottom:6px}
.prose code{background:#EEF4F0;padding:1px 5px;border-radius:5px;font-size:14px}
.map-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.map-row .src{flex:1;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.map-row select{width:52%;height:40px}
@media(hover:hover){.row.tap:hover,.inv-row:hover{background:#F6FBF7}}

@media(max-width:480px){.sv-table th{font-size:12px;padding:9px 5px}.sv-table td{font-size:13px;padding:10px 5px}.sv-table td:first-child,.sv-table th:first-child{padding-left:10px}}
.fabs{display:flex;justify-content:center;gap:34px;margin:6px 0 4px}.fabs .fab-minus{margin:0}
.fab-plus{background:var(--green-d)!important;box-shadow:0 4px 12px rgba(91,176,122,.45)!important}
.balance{text-align:center;margin:10px 0 2px;font-size:15px;color:var(--muted)}.balance b{font-size:18px;margin-left:6px}
.full.income .amount-bar{background:#5BB07A;border-color:#3F9460}
</style>
</head>

/** Interpreta números escritos a mano: "875.000", "1.234,5", "198839.20", "$ 12.500" */
function parseNum(s) {
  if (typeof s === 'number') return s;
  s = String(s ?? '').replace(/[^\d.,\-]/g, '');
  if (!s) return 0;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc >= 0 && ld >= 0) { s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, ''); }
  else if (lc >= 0) { const parts = s.split(','); s = (parts.length === 2 && parts[1].length !== 3) ? s.replace(',', '.') : s.replace(/,/g, ''); }
  else if (ld >= 0) { const parts = s.split('.'); if (parts.length > 2 || parts[1].length === 3) s = s.replace(/\./g, ''); }
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
}

/** Evalúa expresiones simples tipo "1500.5+20" o "1.500×3" (sin eval). Devuelve NaN si es inválida. */
function evalExpr(str) {
  let s = String(str ?? '').trim().replace(/^=/, '').replace(/\s+/g, '').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  if (!s) return 0;
  if (s.includes(',')) s = s.includes('.') ? s.replace(/\./g, '').replace(/,/g, '.') : s.replace(/,/g, '.');
  if (!/^[\d.+\-*/()]+$/.test(s)) return NaN;
  let i = 0;
  const peek = () => s[i];
  function num() { const m = /^\d*\.?\d+|^\d+\.?/.exec(s.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); }
  function factor() {
    if (peek() === '-') { i++; return -factor(); }
    if (peek() === '+') { i++; return factor(); }
    if (peek() === '(') { i++; const v = expr(); if (peek() === ')') i++; return v; }
    return num();
  }
  function term() { let v = factor(); while (peek() === '*' || peek() === '/') { const op = s[i++]; const f = factor(); v = op === '*' ? v * f : v / f; } return v; }
  function expr() { let v = term(); while (peek() === '+' || peek() === '-') { const op = s[i++]; const t = term(); v = op === '+' ? v + t : v - t; } return v; }
  try { const v = expr(); if (i < s.length) { // operador colgando al final: ignorarlo
      if (/^[+\-*/]+$/.test(s.slice(i))) return v; return NaN; } return Math.round(v * 100) / 100; } catch { return NaN; }
}

function hashStr(str) { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); }

function normalize(coll, r) {

  o.updatedAt = Number(o.updatedAt) || 0;
  delete o.serverTs;
  for (const f of (NUMF[coll] || [])) o[f] = (o[f] === '' || o[f] == null) ? 0 : Number(o[f]) || 0;
  for (const f of BOOLF) if (f in o) o[f] = o[f] === true || o[f] === 'TRUE' || o[f] === 'true' || o[f] === 1;
  for (const k in o) if (o[k] === null) o[k] = '';

}
function loadStore() {

}

let syncing = false, syncAgain = false, syncT = 0, syncState = 'off', syncErr = '';
function scheduleSync(ms = 2500) { if (!store.meta.url) return; clearTimeout(syncT); syncT = setTimeout(sync, ms); }
function setSyncState(s, err = '') { syncState = s; syncErr = err; const b = $('#syncBtn'); if (b) { b.dataset.s = s; b.innerHTML = syncIcon(); b.title = syncTitle(); } if (state.view === 'mas/sync') renderMain(); }
const syncIcon = () => icon({ off: 'cloud-off', busy: 'refresh-cw', ok: 'cloud-check', err: 'cloud', pending: 'cloud' }[syncState] || 'cloud');
const syncTitle = () => ({ off: 'Sin sincronizar (configurar en Más)', busy: 'Sincronizando…', ok: 'Sincronizado', err: 'Error de sincronización: ' + syncErr }[syncState] || '');

async function sync(opts = {}) {
  if (!store.meta.url) { setSyncState('off'); return; }
  if (syncing) { syncAgain = true; return; }
  if (!navigator.onLine) { setSyncState('err', 'Sin conexión'); return; }
  syncing = true; setSyncState('busy');
  try {
    const changes = {}, sent = [];
    for (const key in store.dirty) {
      const [c, id] = key.split('|'); const r = store.data[c]?.[id];
      if (!r) { delete store.dirty[key]; continue; }
      (changes[c] = changes[c] || []).push(r); sent.push([key, r.updatedAt]);
    }
    const since = opts.full ? 0 : (store.meta.lastServerTs || 0);
    const res = await fetch(store.meta.url, { method: 'POST', body: JSON.stringify({ token: store.meta.token, since, changes }), redirect: 'follow' });
    const txt = await res.text();
    let j; try { j = JSON.parse(txt); } catch { throw new Error('Respuesta inválida del servidor (¿URL correcta y acceso "Cualquier persona"?)'); }
    if (!j.ok) throw new Error(j.error === 'token' ? 'Clave secreta incorrecta' : (j.error || 'Error del servidor'));
    for (const [key, ts] of sent) { const [c, id] = key.split('|'); if (store.data[c][id]?.updatedAt === ts) delete store.dirty[key]; }
    let changed = 0;
    for (const c in (j.changes || {})) {
      if (!store.data[c]) continue;
      for (const raw of j.changes[c]) {
        if (!raw || raw.id === '' || raw.id == null) continue;
        const r = normalize(c, raw); const cur = store.data[c][r.id];
        if (!cur || r.updatedAt > cur.updatedAt) { store.data[c][r.id] = r; changed++; }
      }
    }
    store.meta.lastServerTs = j.serverTs; store.meta.lastSync = Date.now(); persistNow();
    setSyncState('ok');
    if (changed) safeRender();
  } catch (e) { console.warn(e); setSyncState('err', e.message || String(e)); }
  finally { syncing = false; if (syncAgain) { syncAgain = false; scheduleSync(300); } }
}

/** Valor del servicio para el mes: el cargado, o estimado del último mes con valor. */
function payInfo(svc, mk) {
  const p = get('payments', mk + '_' + svc.id);
  if (p) return { rec: p, amount: p.amount, paid: !!p.paid, est: false };
  for (let i = 1; i <= 24; i++) { const q = get('payments', addMonths(mk, -i) + '_' + svc.id); if (q) return { rec: null, amount: q.amount, paid: false, est: true }; }
  return { rec: null, amount: 0, paid: false, est: true };
}

/** Sugerido: promedio de los últimos 3 meses completos; si la categoría tiene servicios fijos, como mínimo esos fijos. */
function suggestions(mk) {
  const base = mk < curMonth() ? mk : curMonth();
  const months = [1, 2, 3].map(i => addMonths(base, -i)).filter(m => expInMonth(m).length > 0);
  const tot = {};
  months.forEach(m => { const s = spentByCat(m); for (const k in s) tot[k] = (tot[k] || 0) + s[k]; });
  const fijos = {};
  services().forEach(s => { fijos[s.categoryId] = (fijos[s.categoryId] || 0) + payInfo(s, mk).amount; });
  const out = {};
  cats().forEach(c => {
    const avg = months.length ? (tot[c.id] || 0) / months.length : 0;
    const v = Math.max(avg, fijos[c.id] || 0);
    out[c.id] = { avg, fijos: fijos[c.id] || 0, value: v ? Math.ceil(v / 1000) * 1000 : 0 };
  });
  return { out, months };
}

}

function vPresupuesto() {
  const mk = state.bMonth;
  const { out: sug, months } = suggestions(mk);
  const spent = spentByCat(mk);
  const cl = cats();
  const totalBud = sum(cl, c => budgetOf(mk, c.id));
  const incs = incomesOf(mk), totalInc = sum(incs);
  const traer = totalBud - totalInc;
  const totalSpent = sum(Object.values(spent), x => x);
  const started = mk <= curMonth();
  const anyBud = cl.some(c => get('budgets', mk + '_' + c.id));
  const prevMk = addMonths(mk, -1);
  const prevHasBud = cl.some(c => get('budgets', prevMk + '_' + c.id));
  const rows = cl.map(c => {
    const b = budgetOf(mk, c.id), sp = spent[c.id] || 0, sg = sug[c.id];
    const pct = b ? sp / b * 100 : (sp ? 100 : 0);
    const sgTxt = sg.value ? `<button class="sug" data-act="applySug" data-cat="${c.id}" data-v="${sg.value}" title="Promedio 3 meses: ${money(sg.avg)}${sg.fijos ? ' · Fijos: ' + money(sg.fijos) : ''}">Sugerido ${money(sg.value)}</button>` : '<span></span>';
    return `<div class="bud-row"><div class="bud-top">${catIc(c, 40)}<div class="name">${esc(c.name)}</div>
        <input class="bud-inp" inputmode="decimal" data-change="budget" data-cat="${c.id}" value="${b ? fmtNum(b) : ''}" placeholder="0"></div>
      <div class="bud-meta">${sgTxt}${started ? `<span class="${b && sp > b ? 'red' : ''}">Gastado ${money(sp)}</span>` : ''}</div>
      ${started && (b || sp) ? `<div class="bar ${pct > 100 ? 'over' : pct > 85 ? 'warn' : ''}"><i style="width:${Math.min(pct, 100)}%"></i></div>` : ''}</div>`;
  }).join('');
  // Últimos 6 meses
  const ms = [5, 4, 3, 2, 1, 0].map(i => addMonths(curMonth(), -i));
  const vals = ms.map(m => ({ m, sp: sum(expInMonth(m)), bud: sum(cl, c => budgetOf(m, c.id)) }));

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; }
    else f += ch;
  }
  row.push(f); if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}
function impLoad(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('El archivo está vacío o no es un CSV'); return; }
  const header = rows[0].map(h => h.trim());
  const low = header.map(h => h.toLowerCase());
  const find = (re, not) => low.findIndex(h => re.test(h) && !(not && not.test(h)));
  const map = { date: find(/date|fecha|data/), cat: find(/categor/), amount: find(/amount|monto|importe|cantidad|suma|valor/, /convert/), note: find(/descrip|nota|note|coment|comment|memo/) };
  const body = rows.slice(1);
  const hasNeg = map.amount >= 0 && body.some(r => /^\s*-/.test(r[map.amount] || ''));
  // orden de fecha: d/m/y salvo que haya evidencia de m/d/y
  let dmy = true;
  if (map.date >= 0) { let a = 0, b = 0; body.forEach(r => { const m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec((r[map.date] || '').trim()); if (m) { if (+m[1] > 12) a++; if (+m[2] > 12) b++; } }); dmy = !(b > 0 && a === 0); }
  state.imp = { header, body, map, hasNeg, allPosAsExp: !hasNeg, dmy, catMap: {} };
  impAutoCats(); renderMain();
}
function impAutoCats() {
  const s = state.imp; const names = [...new Set(s.body.map(r => (r[s.map.cat] || '').trim()).filter(Boolean))];
  const norm = x => x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  names.forEach(n => {
    if (s.catMap[n]) return;
    const c = cats(true, 'all').find(c => norm(c.name) === norm(n)) || cats(true, 'all').find(c => norm(c.name).startsWith(norm(n)) || norm(n).startsWith(norm(c.name)));
    s.catMap[n] = c ? c.id : '__new';
  });
}
function impDate(str, dmy) {
  str = (str || '').trim();
  let m = /^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/.exec(str); if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(str);
  if (m) { let [, a, b, y] = m; if (y.length === 2) y = '20' + y; const [d, mo] = dmy ? [a, b] : [b, a]; if (+mo < 1 || +mo > 12 || +d < 1 || +d > 31) return null; return `${y}-${pad(mo)}-${pad(d)}`; }
  const t = Date.parse(str); if (!isNaN(t)) { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  return null;
}
function impParse() {
  const s = state.imp; const out = { rows: [], bad: 0, skippedIncome: 0, catNames: [], min: '', max: '', incCats: new Set() };
  const names = new Set(); const seen = {};
  for (const r of s.body) {
    const date = impDate(r[s.map.date], s.dmy); const raw = (r[s.map.amount] || '').trim();
    if (!date || !raw) { out.bad++; continue; }
    let amt = parseNum(raw.replace(/\s/g, ''));
    let kind = '';
    if (s.hasNeg) { if (amt > 0) kind = 'income'; else amt = -amt; }
    else if (!s.allPosAsExp) { out.skippedIncome++; continue; }
    if (!amt) continue;
    const cat = (r[s.map.cat] || '').trim() || 'Otros'; names.add(cat); if (kind) out.incCats.add(cat);
    const note = s.map.note >= 0 ? (r[s.map.note] || '').trim() : '';
    const key = `${date}|${amt}|${cat}|${note}`; seen[key] = (seen[key] || 0) + 1;
    out.rows.push({ date, amount: Math.round(amt * 100) / 100, cat, note, kind, id: 'm_' + hashStr(key + '|' + seen[key]) });
  }
  out.catNames = [...names].sort();
  const ds = out.rows.map(r => r.date).sort(); out.min = ds[0] || ''; out.max = ds[ds.length - 1] || '';
  return out;
}
function doImport() {
  const s = state.imp; impAutoCats(); const p = impParse();
  const catIds = {}; let order = Math.max(-1, ...cats(true, 'all').map(c => c.order)) + 1;
  p.catNames.forEach(n => {
    let id = s.catMap[n];
    if (!id || id === '__new') { const inc = p.incCats.has(n); id = (inc ? 'inc_' : 'cat_') + hashStr(n.toLowerCase()); if (!get('categories', id)) put('categories', { id, name: n, icon: inc ? 'banknote' : 'circle', color: COLORS[order % COLORS.length], order: order++, kind: inc ? 'income' : '' }, { silent: true }); }
    catIds[n] = id;
  });
  let n = 0;
  p.rows.forEach(r => { if (!get('expenses', r.id)) n++; put('expenses', { id: r.id, date: r.date, amount: r.amount, categoryId: catIds[r.cat], note: r.note, paymentId: '', src: 'monefy', kind: r.kind }, { silent: true }); });
  persistNow(); state.imp = null; scheduleSync(200);
  toast(`Listo: ${n} movimientos nuevos importados`);
  state.view = 'gastos'; state.gPeriod = 'all'; history.pushState(null, '', '#gastos'); render();
}

// ---------------------------------------------------------------- vista: SYNC

  return `<div class="card pad prose">Tus datos se guardan en este dispositivo y se copian a una planilla de <b>Google Sheets en tu Drive</b>. Así el celular y la compu ven lo mismo y queda el histórico.<br><br>
      Para configurarlo seguí la guía <b>GUIA-INSTALACION</b> (paso 2). Al final vas a tener una <b>URL</b> y una <b>clave secreta</b> para pegar acá. Hacelo una vez en cada dispositivo.</div>
    <div class="card pad"><div class="field"><label>URL del Web App (termina en /exec)</label><input class="inp" id="syUrl" value="${esc(m.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label>Clave secreta</label><input class="inp" id="syTok" value="${esc(m.token)}" placeholder="La misma que pusiste en Code.gs" autocomplete="off" autocapitalize="off" spellcheck="false"></div>

    ${m.url ? `<div class="card"><div class="row"><div class="grow"><div class="name">Estado</div><div class="sub ${syncState === 'err' ? 'red' : ''}">${esc(st)}</div></div></div>
      <div class="row"><div class="grow"><div class="name">Última sincronización</div><div class="sub">${m.lastSync ? new Date(m.lastSync).toLocaleString('es-AR') : 'nunca'}</div></div></div>
      <div class="row"><div class="grow"><div class="name">Cambios pendientes de subir</div><div class="sub">${pend}</div></div></div></div>
      <div class="btns"><button class="btn ghost" data-act="syncNow">${icon('refresh-cw')} Sincronizar ahora</button><button class="btn ghost" data-act="syncFull">Descargar todo</button></div>
      <button class="btn danger block" style="margin-top:10px" data-act="unlinkSync">Desconectar</button>` : ''}`;

function download(name, text, type) {
  const blob = new Blob([text], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ---------------------------------------------------------------- modal & toast
let modalOpts = null;
function openModal(html, opts = {}) {
  closeModal(true);

function closeModal(silent) { const m = $('#modal'); if (m) m.remove(); modalOpts = null; if (!silent && pendingRender && !$('.full')) { pendingRender = false; render(); } }
function closeAllOverlays() { closeModal(true); if ($('#expFull')) closeExpense(true); }

  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = esc(msg) + (undo ? '<button class="undo">Deshacer</button>' : '');
  if (undo) t.querySelector('.undo').onclick = () => { undo(); t.remove(); };
  document.body.appendChild(t); toastT = setTimeout(() => t.remove(), undo ? 5000 : 2600);
}

// ---------------------------------------------------------------- acciones (delegación de eventos)

  },
  delSaving: el => { remove('savings', el.dataset.id); closeModal(); renderMain(); },
  editTracker: el => trackerModal(el.dataset.id),
  saveTracker: el => { const name = $('#tName').value.trim(); if (!name) return; const id = el.dataset.id || 'trk_' + uid(); put('trackers', { id, name, currency: $('#tCur').value, ...(el.dataset.id ? {} : { order: all('trackers').length }) }); state.sTracker = id; closeModal(); renderMain(); },
  delTracker: el => { if (!confirm('¿Borrar este seguimiento y todos sus meses?')) return; const id = el.dataset.id; all('savings').filter(s => s.trackerId === id).forEach(s => remove('savings', s.id)); remove('trackers', id); closeModal(); renderMain(); },
  // inversión
  iPlan: el => { state.iPlan = el.dataset.id; renderMain(); },
  newPlan: () => planModal(), editPlan: el => planModal(el.dataset.id),
  savePlan: el => { const name = $('#pName').value.trim(); if (!name) return; const id = el.dataset.id || 'inv_' + uid(); put('investPlans', { id, name, ...(el.dataset.id ? {} : { total: 0, order: all('investPlans').length }) }); state.iPlan = id; closeModal(); renderMain(); },
  delPlan: el => { if (!confirm('¿Borrar este plan?')) return; all('investItems').filter(i => i.planId === el.dataset.id).forEach(i => remove('investItems', i.id)); remove('investPlans', el.dataset.id); closeModal(); renderMain(); },
  editInvItem: el => invItemModal(el.dataset.id),
  saveInvItem: el => { const name = $('#iName').value.trim(); if (!name) return; const id = el.dataset.id || 'ii_' + uid(); put('investItems', { id, planId: state.iPlan, name, motive: $('#iMot').value.trim(), pct: parseNum($('#iPct').value), ...(el.dataset.id ? {} : { order: all('investItems').filter(i => i.planId === state.iPlan).length }) }); closeModal(); renderMain(); },
  delInvItem: el => { remove('investItems', el.dataset.id); closeModal(); renderMain(); },
  // categorías

  pickColor: el => { catDraft.color = el.dataset.c; updCatPreview(); }, pickIcon: el => { catDraft.icon = el.dataset.n; updCatPreview(); },

  saveSync: () => {

};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.change && CH[el.dataset.change]) CH[el.dataset.change](el);
  else if (el.id === 'impFile' && el.files[0]) { const r = new FileReader(); r.onload = () => impLoad(String(r.result)); r.readAsText(el.files[0]); el.value = ''; }
  else if (el.id === 'restoreFile' && el.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); if (!o.data) throw 0; let n = 0; COLLS.forEach(c => Object.values(o.data[c] || {}).forEach(rec => { const cur = store.data[c][rec.id]; if (!cur || rec.updatedAt > cur.updatedAt) { store.data[c][rec.id] = normalize(c, rec); store.dirty[c + '|' + rec.id] = 1; n++; } })); persistNow(); scheduleSync(200); render(); toast(`Restaurados ${n} registros`); } catch { toast('Archivo inválido'); } };
    r.readAsText(el.files[0]); el.value = '';
  }
});
document.addEventListener('input', e => { if (e.target.dataset.input === 'svPrev') svPreview(); });
document.addEventListener('keydown', e => {
  if (ex && $('#expFull') && !$('#modal')) {
    if (e.target.id === 'exNote') { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } return; }
    const map = { Backspace: 'bk', Enter: '=', '=': '=', '.': ',', ',': ',', '+': '+', '-': '-', '*': '*', x: '*', '/': '/' };
    if (/^\d$/.test(e.key)) { keyPress(e.key); e.preventDefault(); }
    else if (e.key === 'Enter' && !/[+\-*/]/.test(ex.expr.replace(/^-/, '')) && ex.step === 'keys') { e.preventDefault(); ex.cat && !ex.id ? saveExpense() : (ex.id ? saveExpense() : A.exChooseCat()); }
    else if (map[e.key]) { keyPress(map[e.key]); e.preventDefault(); }
    else if (e.key === 'Escape') closeExpense();
    return;
  }
  if ($('#modal')) {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { const b = $('#modal .btns .btn:last-child'); if (b) { e.preventDefault(); b.click(); } }
    return;
  }
  if (e.target.tagName === 'INPUT' && e.key === 'Enter') { e.target.blur(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;

setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 120000);

// cambio de día/mes con la app abierta

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
